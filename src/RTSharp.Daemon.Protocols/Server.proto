syntax = "proto3";

option csharp_namespace = "RTSharp.Daemon.Protocols";

import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service GRPCServerService {
    rpc Test (google.protobuf.Empty) returns (google.protobuf.Empty);

    rpc GetServerSettings (google.protobuf.Empty) returns (ServerSettings);

    rpc StartScript (StartScriptInput) returns (ScriptSessionReply);
    rpc ScriptStatus (google.protobuf.BytesValue) returns (stream ScriptProgressState);
    rpc ScriptsStatus (ScriptSessionsStatusRequest) returns (stream ScriptSessionUpdate);
    rpc ScriptChannel (stream ScriptChannelRequest) returns (stream ScriptMessage);
    rpc StopScript (google.protobuf.BytesValue) returns (google.protobuf.Empty);
    rpc RemoveScript (google.protobuf.BytesValue) returns (google.protobuf.Empty);

    rpc InstallScript (InstallScriptInput) returns (InstalledScript);
    rpc UninstallScript (google.protobuf.StringValue) returns (google.protobuf.Empty);
    rpc ListInstalledScripts (google.protobuf.Empty) returns (InstalledScriptList);
    rpc AcknowledgeOrphanedScript (google.protobuf.StringValue) returns (InstalledScript);
}

message ServerSettings {
    optional uint64 DLBandwidth = 1;
    optional uint64 UPBandwidth = 2;
}

message ScriptMessage {
    string Type = 1;
    bytes Payload = 2; // msgpack
}

message ScriptChannelRequest {
    optional bytes Attach = 1;
    ScriptMessage Input = 2;
}

message StartScriptInput {
    string Script = 1;
    string Name = 2;
    repeated ScriptMessage Input = 3;
}

enum TaskState {
    WAITING = 0;
    RUNNING = 1;
    FAILED = 2;
    DONE = 3;
    CANCELLED = 4;
}

message ScriptProgressState {
    bytes Id = 1;
    repeated ScriptProgressState Chain = 2;
    string Text = 3;
    float Progress = 4;
    TaskState State = 5;
}

enum ScriptSessionsStatusMode {
    NONE = 0;
    STREAMING = 1;
    FULL_UPDATE = 2;
}

message ScriptSessionsStatusRequest {
    ScriptSessionsStatusMode Mode = 1;
}

message ScriptSessionUpdate {
    bytes SessionId = 1;
    string SessionName = 2;
    google.protobuf.BytesValue ParentStateId = 3;
    ScriptProgressState State = 4;
    google.protobuf.StringValue InstalledScriptId = 5;
}

message ScriptSessionReply {
    bytes Id = 1;
}

message InstallScriptInput {
    string Id = 1;
    string OwnerId = 2;
    StartScriptInput Start = 3;
}

message InstalledScript {
    string Id = 1;
    string Name = 2;
    string OwnerId = 3;
    bytes ScriptHash = 4;
    bool OrphanAcknowledged = 5;
    google.protobuf.BytesValue SessionId = 6;
    TaskState State = 7;
    string StatusText = 8;
    string LastError = 9;
    google.protobuf.Timestamp InstalledAt = 10;
    google.protobuf.Timestamp StartedAt = 11;
}

message InstalledScriptList {
    repeated InstalledScript Scripts = 1;
}
