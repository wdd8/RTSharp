syntax = "proto3";

option csharp_namespace = "RTSharp.Daemon.Protocols.DataProvider";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message TorrentTracker {
    string ID = 1;
    string Uri = 2;
    TorrentTrackerStatus Status = 3;
    uint32 Seeders = 4;
    uint32 Peers = 5;
    uint32 Downloaded = 6;
    // Last announce response; unset when the daemon doesn't know it
    google.protobuf.Timestamp LastUpdated = 7;
    // Announce interval the tracker asked for; unset when the daemon doesn't know it
    google.protobuf.Duration Interval = 8;
    string StatusMessage = 9;
    // Unset when no announce is scheduled
    google.protobuf.Timestamp NextAnnounce = 10;
}

// One of WORKING, NOT_WORKING, NOT_CONTACTED_YET or DISABLED, optionally with UPDATING.
// A tracker of a torrent that isn't running is NOT_CONTACTED_YET.
enum TorrentTrackerStatus {
    option allow_alias = true;
    reserved 0x10;
    TorrentTrackerStatus_PLACEHOLDER = 0x00;
    // Last announce succeeded
    TorrentTrackerStatus_WORKING = 0x01;
    // Last announce failed
    TorrentTrackerStatus_NOT_WORKING = 0x02;
    TorrentTrackerStatus_NOT_CONTACTED_YET = 0x04;
    TorrentTrackerStatus_DISABLED = 0x08;
    // Announce in progress
    TorrentTrackerStatus_UPDATING = 0x20;
    TorrentTrackerStatus_MAX = 0x20;
}