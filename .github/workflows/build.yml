name: dotnet package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
        self_contained: [false, true]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Resolve .NET SDK versions
        id: dotnet
        run: |
          {
            echo "versions<<EOF"
            for PROJ in src/RTSharp/RTSharp.csproj src/RTSharp.Daemon/RTSharp.Daemon.csproj; do
              TFMS=$(grep -oP '(?<=<TargetFramework>|<TargetFrameworks>)[^<]+' "$PROJ" | head -1)
              if [ -z "$TFMS" ]; then echo "No <TargetFramework(s)> in $PROJ" >&2; exit 1; fi
              for TFM in ${TFMS//;/ }; do echo "${TFM#net}.x"; done
            done | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet.outputs.versions }}
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Install CHM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-utils
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/RTSharp.Shared.Utils/Native/rls/go.mod
          cache-dependency-path: src/RTSharp.Shared.Utils/Native/rls/go.sum
      - name: Publish ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
        run: pwsh scripts/publish.ps1 ${{ matrix.rid }}${{ matrix.self_contained == true && ' -SelfContained' || '' }}
      - name: Publish daemon ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
        if: startsWith(matrix.rid, 'linux-')
        run: |
          for TFM in $(dotnet msbuild ./src/RTSharp.Daemon/RTSharp.Daemon.csproj -getProperty:TargetFrameworks | tr ';' ' '); do
            dotnet publish ./src/RTSharp.Daemon -c Release -f "$TFM" -r ${{ matrix.rid }} ${{ matrix.self_contained == true && '--self-contained' || '--no-self-contained' }} -o ${{ matrix.rid }}-daemon${{ matrix.self_contained == true && '-self-contained' || '' }}/$TFM
          done
      - name: Test
        if: matrix.rid == 'linux-x64' && matrix.self_contained == false
        run: |
          for PROJ in src/*.Tests/*.Tests.csproj; do
            dotnet run --project "$PROJ" -c Release -r linux-x64
          done
      - name: Upload build ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
          path: ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
      - name: Upload daemon ${{ matrix.rid }}${{ matrix.self_contained == true && '-self-contained' || '' }}
        if: startsWith(matrix.rid, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}-daemon${{ matrix.self_contained == true && '-self-contained' || '' }}
          path: ${{ matrix.rid }}-daemon${{ matrix.self_contained == true && '-self-contained' || '' }}

  docker:
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-x64-daemon
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64-daemon
    steps:
      - uses: actions/checkout@v4
      - name: Download daemon artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
      - name: Stage build context
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          ARCH="${PLATFORM#linux/}"
          mkdir -p "docker-context/${ARCH}"
          cp -r "artifacts/${{ matrix.artifact }}/net11.0/." "docker-context/${ARCH}/"
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/daemon" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RTSharp.Daemon/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Extract version
        id: version
        run: echo "version=$(grep -oP '(?<=<RTSharpVersion>)[^<]+' Version.props)" >> "$GITHUB_OUTPUT"
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/daemon" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ steps.image.outputs.name }}:latest \
            -t ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }} \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve .NET SDK versions
        id: dotnet
        run: |
          {
            echo "versions<<EOF"
            for PROJ in src/RTSharp/RTSharp.csproj src/RTSharp.Daemon/RTSharp.Daemon.csproj; do
              TFMS=$(grep -oP '(?<=<TargetFramework>|<TargetFrameworks>)[^<]+' "$PROJ" | head -1)
              if [ -z "$TFMS" ]; then echo "No <TargetFramework(s)> in $PROJ" >&2; exit 1; fi
              for TFM in ${TFMS//;/ }; do echo "${TFM#net}.x"; done
            done | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.dotnet.outputs.versions }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd pandoc
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP '(?<=<RTSharpVersion>)[^<]+' Version.props)
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping."
            exit 0
          fi
          for RID in linux-x64 linux-arm64 win-x64 win-arm64; do
            case "$RID" in linux-*) chmod +x "${RID}/RTSharp" "${RID}-self-contained/RTSharp" "${RID}/rls" "${RID}-self-contained/rls" ;; esac
            (cd "$RID" && zip -r "../RTSharp-${RID}-v${VERSION}.zip" .)
            (cd "${RID}-self-contained" && zip -r "../RTSharp-${RID}-self-contained-v${VERSION}.zip" .)
          done
          for RID in linux-x64 linux-arm64; do
            for SC in "" "-self-contained"; do
              for DIR in "${RID}-daemon${SC}"/*/; do
                TFM=$(basename "$DIR")
                chmod +x "${DIR}RTSharp.Daemon" "${DIR}rls"
                (cd "$DIR" && zip -r "../../RTSharp-Daemon-${RID}-${TFM}${SC}-v${VERSION}.zip" .)
              done
            done
            for FORMAT in deb rpm pkg.tar.zst; do
              dotnet run scripts/package-linux.cs -- "$FORMAT" "$RID" "$VERSION" client
              for DIR in "${RID}-daemon"/*/; do
                dotnet run scripts/package-linux.cs -- "$FORMAT" "$RID" "$VERSION" daemon "$(basename "$DIR")"
              done
            done
          done
          dotnet run scripts/release-notes.cs -- "$VERSION" "$GITHUB_REPOSITORY"
          gh release create "v${VERSION}" \
            --title "RTSharp v${VERSION}" \
            --notes-file release_notes.md \
            $(cat assets.txt)
